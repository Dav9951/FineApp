# Konfiguracja gitleaks: domyślne reguły + wyjątki dla stałych z testów.
#   gitleaks git --redact          # historia
#   gitleaks dir . --redact        # bieżące pliki

[extend]
useDefault = true

[[allowlists]]
description = "Stałe klucze Idempotency-Key w testach API — nie są sekretami"
regexes = [
  '''^3f0c7c1e-6a8e-4b8a-9d1e-0c2b5f1a7e44$''',
  '''^klucz-testowy-\d+$''',
  '''^wspolny-klucz-\d+$''',
]
